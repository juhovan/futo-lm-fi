name: Build and publish image

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out pipeline
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # sha-<commit>: immutable per build. latest: only this workflow
          # runs, and only on master pushes, so it never points elsewhere.
          tags: |
            ghcr.io/juhovan/futo-lm-fi:sha-${{ github.sha }}
            ghcr.io/juhovan/futo-lm-fi:latest
          cache-from: type=gha
          cache-to: type=gha
